{% extends "base.html" %}
{% block title %}Register - LifeFlow{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="login-logo">
            <h3 style="color: #C41E3A;">Create Account</h3>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required minlength="6">
            </div>
            <div class="mb-4">
                <label class="form-label">Role</label>
                <select name="role" class="form-select">
                    <option value="staff">Staff</option>
                    <option value="donor">Donor</option>
                </select>
            </div>
            <button type="submit" class="btn btn-blood w-100">Register</button>
        </form>
        <p class="text-center mt-3">Already have account? <a href="{{ url_for('login') }}" style="color:#D4AF37;">Login</a></p>
    </div>
</div>
{% endblock %}
