{% extends "base.html" %}
{% block title %}Login - LifeFlow{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-card text-center">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="LifeFlow Logo" class="login-logo">
        <h2 class="mb-1" style="color: #C41E3A;">LifeFlow</h2>
        <p class="text-muted mb-4">Vijayawada Blood Bank Management System</p>
        
        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label"><i class="fas fa-user"></i> Username</label>
                <input type="text" name="username" class="form-control form-control-lg" required placeholder="Enter username" value="admin">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control form-control-lg" required placeholder="Enter password" value="admin123">
            </div>
            <button type="submit" class="btn btn-blood btn-lg w-100 mb-3">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        <p class="mt-3 mb-0">New user? <a href="{{ url_for('register') }}" style="color: #D4AF37;">Register here</a></p>
        <p class="mt-2 small text-muted">Demo: admin / admin123</p>
        <hr class="my-3" style="border-color:#C41E3A;">
        <a href="{{ url_for('donor_register') }}" class="btn btn-outline-blood btn-sm">
            <i class="fas fa-heart"></i> Register as Blood Donor (Public)
        </a>
    </div>
</div>
{% endblock %}
